name: Build & Deploy

on:
  # Bei jedem Push auf main
  push:
    branches: [main]
  # Täglich um 04:00 UTC neu bauen -> holt aktuelle Termine aus dem Kalender
  schedule:
    - cron: "0 4 * * *"
  # Manuell über den Actions-Tab startbar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Seite bauen
        run: npm run build
      - name: Konfiguration für Pages
        uses: actions/configure-pages@v5
      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
